<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNR Converter by Nurdaulet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fff;
    color: #111;
    min-height: 100vh;
  }

  /* ── ШАПКА ─────────────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: stretch;
    gap: 12px;
    padding: 10px 14px 6px;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
  }

  .logo-sabre {
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 32px;
    font-style: italic;
    color: #e8001c;
    white-space: nowrap;
    align-self: center;
    line-height: 1;
    padding-right: 4px;
  }

  .input-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  #pnrInput {
    width: 100%;
    height: 90px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 3px;
    padding: 6px 8px;
    resize: vertical;
    background: #f9f9f9;
    color: #111;
    outline: none;
  }
  #pnrInput:focus { border-color: #003366; }

  #statusMsg {
    font-size: 12px;
    min-height: 16px;
    color: #cc0000;
  }
  #statusMsg.ok { color: #2a7a3a; }

  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }

  .logo-amadeus {
    line-height: 1;
    white-space: nowrap;
  }
  .logo-amadeus .ama { font-family: Arial, sans-serif; font-size: 20px; color: #003366; font-weight: 400; }
  .logo-amadeus .DE  { font-family: Arial, sans-serif; font-size: 20px; color: #003366; font-weight: 700; }
  .logo-amadeus .us  { font-family: Arial, sans-serif; font-size: 20px; color: #003366; font-weight: 400; }

  .header-btns { display: flex; gap: 6px; }

  .btn {
    border: none; cursor: pointer; border-radius: 3px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px; padding: 6px 14px; white-space: nowrap;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-red  { background: #cc0000; color: #fff; }
  .btn-blue { background: #003366; color: #fff; }

  /* ── ОБЛАСТЬ КАРТОЧЕК ──────────────────────────────────────── */
  .cards-area {
    padding: 10px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── КАРТОЧКА ──────────────────────────────────────────────── */
  .card {
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px 5px;
    border-bottom: 1px solid #eee;
  }

  .card-title {
    font-weight: 700;
    font-size: 14px;
    flex: 1;
  }

  .icon-btn {
    background: #f0f0f0; border: none; cursor: pointer;
    border-radius: 3px; font-size: 13px; padding: 2px 7px;
    color: #555; line-height: 1.4;
  }
  .icon-btn:hover { background: #e0e0e0; }

  .del-btn {
    background: #cc0000; color: #fff; border: none;
    cursor: pointer; border-radius: 3px;
    font-size: 13px; font-weight: 700;
    padding: 2px 8px; line-height: 1.4;
  }
  .del-btn:hover { background: #e04040; }

  /* Превью */
  .card-preview {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12.5px;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
    color: #111;
    border-bottom: 1px solid #eee;
    background: #fff;
  }

  /* Строка управления */
  .card-ctrl {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 6px 10px 8px;
    background: #fafafa;
  }

  /* Одна строка кнопок */
  .ctrl-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }

  .ctrl-divider {
    width: 1px; height: 24px;
    background: #ccc;
    flex-shrink: 0;
    margin: 0 3px;
    align-self: center;
  }

  .ctrl-pair {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  /* Кнопка-переключатель */
  .tgl-btn {
    background: #f0f0f0; color: #444;
    border: 1px solid #ddd;
    border-radius: 3px; cursor: pointer;
    font-size: 12px; padding: 3px 9px;
    white-space: nowrap; line-height: 1.4;
    transition: background .12s, color .12s;
  }
  .tgl-btn:hover { background: #e4e4e4; }
  .tgl-btn.active {
    background: #2d2d2d; color: #fff;
    border-color: #2d2d2d;
  }

  /* Поле цены */
  .price-input {
    width: 72px; font-size: 12px;
    border: 1px solid #ccc; border-radius: 3px;
    padding: 3px 5px; background: #f9f9f9;
    color: #111; outline: none; font-family: inherit;
  }
  .price-input:focus { border-color: #003366; }

  /* ── АДАПТИВ ────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .header { flex-wrap: wrap; }
    .logo-sabre { font-size: 26px; }
    .logo-amadeus .ama, .logo-amadeus .DE, .logo-amadeus .us { font-size: 16px; }
    .input-wrap { order: 3; flex-basis: 100%; }
    .right-col { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
    .card-ctrl { gap: 5px; }
    .ctrl-divider { display: none; }
  }
</style>
</head>

const AIRPORTS_URL = "./pnr_db.txt";

function parseDB(text) {
  let section = 'airports';
  const lines = text.split('\n');
  for (let line of lines) {
    line = line.trim();
    if (!line || line.startsWith('#')) continue;
    if (line === '[airlines]') { section = 'airlines'; continue; }
    const eq = line.indexOf('=');
    if (eq === -1) continue;
    const code = line.substring(0, eq).trim().toUpperCase();
    const name = line.substring(eq + 1).trim();
    if (!code || !name) continue;
    if (section === 'airports') {
      AIRPORTS[code] = name;
    } else {
      AIRLINES[code] = name;
    }
  }
}

async function loadAirports() {
  try {
    const r = await fetch('./pnr_db.txt?v=' + Date.now());
    const text = await r.text();
    parseDB(text);
  } catch(e) {
    console.log('База не загружена:', e);
  }
}
document.addEventListener('DOMContentLoaded', loadAirports);

// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ═══════════════════════════════════════════════════════════════

function toMins(hhmm) {
  return parseInt(hhmm.slice(0,2), 10) * 60 + parseInt(hhmm.slice(2), 10);
}

function monthNum(mon) {
  return MONTH_NUM[(mon||'').toUpperCase()] || 1;
}

function fmtTime(hhmm) {
  return hhmm.slice(0,2) + ':' + hhmm.slice(2);
}

function plural(n, f1, f2, f5) {
  n = Math.abs(n);
  const r100 = n % 100, r10 = n % 10;
  if (r100 >= 11 && r100 <= 14) return f5;
  if (r10 === 1) return f1;
  if (r10 >= 2 && r10 <= 4) return f2;
  return f5;
}

function fmtDur(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  const parts = [];
  if (h) parts.push(h + ' ' + plural(h,'час','часа','часов'));
  if (m) parts.push(m + ' ' + plural(m,'минута','минуты','минут'));
  return parts.length ? parts.join(', ') : '0 минут';
}

function airportName(code) { return AIRPORTS[code.toUpperCase()] || code; }
function airlineName(code) { return AIRLINES[code.toUpperCase()] || code; }
function monthRu(mon)      { return MONTHS_RU[(mon||'').toUpperCase()] || mon.toLowerCase(); }

// РАСЧЁТ ДЛИТЕЛЬНОСТИ И ПЕРЕСАДКИ
// ═══════════════════════════════════════════════════════════════

function calcDuration(seg) {
  const depTZ = TIMEZONES[seg.from] !== undefined ? TIMEZONES[seg.from] : 0;
  const arrTZ = TIMEZONES[seg.to]   !== undefined ? TIMEZONES[seg.to]   : 0;
  let depUTC = toMins(seg.dep) - depTZ * 60;
  let arrUTC = toMins(seg.arr) - arrTZ * 60;
  const dd = parseInt(seg.depDay, 10), ad = parseInt(seg.arrDay, 10);
  const dm = monthNum(seg.depMon),     am = monthNum(seg.arrMon);
  if (ad > dd || am > dm) arrUTC += 1440;
  if (arrUTC <= depUTC) arrUTC += 1440;
  return arrUTC - depUTC;
}

function calcLayover(s1, s2) {
  const arr = toMins(s1.arr);
  const dep = toMins(s2.dep);
  const ad = parseInt(s1.arrDay, 10), dd2 = parseInt(s2.depDay, 10);
  const am = monthNum(s1.arrMon), dm2 = monthNum(s2.depMon);
  // Подсчёт разницы в днях через разницу месяцев и дней
  let dayDiff = (dm2 - am) * 31 + (dd2 - ad);
  if (dayDiff < 0) dayDiff = 0;
  let layover = dep + dayDiff * 1440 - arr;
  if (layover < 0) layover += 1440;
  return layover;
}

// Мусорные строки
// Подстроки, которые в любом месте строки означают мусор
const JUNK_ANYWHERE = [
  'OPERATED BY','PLS ADD','TKT/TIME LIMIT','SEE RTSVC','FARE QUOTE'
];
// Префиксы — мусорные только если строка НАЧИНАЕТСЯ с них (после пробелов)
const JUNK_PREFIX = ['/DC','RP/','--- MSC','--- AIR'];

function isJunk(line) {
  const u = line.toUpperCase().trim();
  if (JUNK_ANYWHERE.some(j => u.includes(j))) return true;
  if (JUNK_PREFIX.some(j => u.startsWith(j)))  return true;
  if (/^[0-9A-Z]{2,}\.[0-9A-Z]{2,}/.test(u))  return true; // 77E8.77E8
  return false;
}

// Дата прилёта следующий день: \d{1,2}[A-Z]{3} после времени прилёта
const RE_ARRDATE = /(?<!\w)(\d{1,2})([A-Z]{3})(?!\w)/;

function extractTimes(rest, depDay, depMon) {
  // Паттерн: HHMM с необязательным суффиксом +N (следующий день)
  const timePattern = /\b([01]\d[0-5]\d|2[0-3][0-5]\d)(\+\d)?\b/g;
  const times = [];
  let m;
  while ((m = timePattern.exec(rest)) !== null) {
    times.push({ val: m[1], offset: m[2] ? parseInt(m[2].slice(1), 10) : 0, idx: m.index + m[0].length });
    if (times.length === 2) break;
  }
  if (times.length < 2) return null;
  const depTime = times[0].val;
  const arrTime = times[1].val;
  const arrOffset = times[1].offset;

  let arrDay = depDay, arrMon = depMon.toUpperCase();
  if (arrOffset > 0) {
    // "+1" формат Amadeus — прибавляем дни к дате вылета
    arrDay = String(parseInt(depDay, 10) + arrOffset);
  } else {
    // Ищем явную дату после времени прилёта (например "15JAN")
    const afterArr = rest.slice(times[1].idx);
    const dm = RE_ARRDATE.exec(afterArr);
    if (dm) { arrDay = dm[1]; arrMon = dm[2].toUpperCase(); }
  }

  return { depTime, arrTime, arrDay, arrMon };
}

// Регулярки форматов (с номером сегмента)
// Sabre: класс тарифа слитно с номером рейса
const RE_SABRE   = /^\s*(\d+)\s+([A-Z0-9]{2})\s*(\d{1,4})[A-Z]?\s+(\d{1,2})([A-Z]{3})\s+\d\s+([A-Z]{3})([A-Z]{3})[* ]*(?:HK|SS|UN|HL|TK|SA|NN|WL|GK|RR|KK|LL)\d+(.*)$/i;
// Amadeus: класс тарифа — отдельный токен
const RE_AMADEUS = /^\s*(\d+)\s+([A-Z0-9]{2})\s*(\d{1,4})\s+[A-Z]\s+(\d{1,2})([A-Z]{3})\s+\d\s+([A-Z]{3})([A-Z]{3})\s+(?:HK|SS|UN|HL|TK|SA|NN|WL|GK|RR|KK|LL)\d+(.*)$/i;

// Те же форматы БЕЗ номера сегмента в начале (группы сдвинуты на -1)
const RE_SABRE_NN   = /^\s*([A-Z0-9]{2})\s*(\d{1,4})[A-Z]?\s+(\d{1,2})([A-Z]{3})\s+\d\s+([A-Z]{3})([A-Z]{3})[* ]*(?:HK|SS|UN|HL|TK|SA|NN|WL|GK|RR|KK|LL)\d+(.*)$/i;
const RE_AMADEUS_NN = /^\s*([A-Z0-9]{2})\s*(\d{1,4})\s+[A-Z]\s+(\d{1,2})([A-Z]{3})\s+\d\s+([A-Z]{3})([A-Z]{3})\s+(?:HK|SS|UN|HL|TK|SA|NN|WL|GK|RR|KK|LL)\d+(.*)$/i;

function makeSeg(airline, flight, depDay, depMon, from, to, t) {
  return {
    airline: airline.toUpperCase(), flight,
    depDay, depMon: depMon.toUpperCase(),
    from: from.toUpperCase(), to: to.toUpperCase(),
    dep: t.depTime, arr: t.arrTime,
    arrDay: t.arrDay, arrMon: t.arrMon
  };
}

function parseSegments(text) {
  const segs = {};  // ключ: номер сегмента (1–99) или авто (0, 1, 2…)
  let autoKey = 0;  // авто-нумерация: начинаем с 0, чтобы сортироваться ДО явных номеров

  for (const raw of text.split('\n')) {
    const line = raw.replace(/\r/g, '');
    if (isJunk(line)) continue;

    // ── Amadeus с номером ──────────────────────────────────────
    let m = RE_AMADEUS.exec(line);
    if (m) {
      const segNum = parseInt(m[1], 10);
      if (segNum in segs) continue;
      const t = extractTimes(m[8], m[4], m[5]);
      if (t) segs[segNum] = makeSeg(m[2], m[3], m[4], m[5], m[6], m[7], t);
      continue;
    }

    // ── Sabre с номером ────────────────────────────────────────
    m = RE_SABRE.exec(line);
    if (m) {
      const segNum = parseInt(m[1], 10);
      if (segNum in segs) continue;
      const t = extractTimes(m[8], m[4], m[5]);
      if (t) segs[segNum] = makeSeg(m[2], m[3], m[4], m[5], m[6], m[7], t);
      continue;
    }

    // ── Amadeus БЕЗ номера (авто-нумерация) ───────────────────
    m = RE_AMADEUS_NN.exec(line);
    if (m) {
      const t = extractTimes(m[7], m[3], m[4]);
      if (t) { while (autoKey in segs) autoKey++; segs[autoKey++] = makeSeg(m[1], m[2], m[3], m[4], m[5], m[6], t); }
      continue;
    }

    // ── Sabre БЕЗ номера (авто-нумерация) ─────────────────────
    m = RE_SABRE_NN.exec(line);
    if (m) {
      const t = extractTimes(m[7], m[3], m[4]);
      if (t) { while (autoKey in segs) autoKey++; segs[autoKey++] = makeSeg(m[1], m[2], m[3], m[4], m[5], m[6], t); }
    }
  }

  return Object.keys(segs)
    .map(Number)
    .sort((a, b) => a - b)
    .map(k => segs[k]);
}

function buildPriceLine(active, prices, mainPrice) {
  const mp = (mainPrice || '').trim();
  const hasOther = active.size > 0;

  // Случай Г: главная цена пустая и ничего не выбрано
  if (!mp && !hasOther) return '';

  // Собираем секции остальных кнопок
  const sections = [];
  for (const grp of OUTPUT_GROUPS) {
    const parts = grp.opts
      .filter(o => active.has(o))
      .map(o => {
        const p = (prices[o] || '').trim();
        if (!p) return outLabel(o);
        return grp.tg ? `${outLabel(o)} ${p}тг` : `${outLabel(o)} ${p}`;
      });
    if (parts.length) sections.push(parts.join(grp.sep));
  }

  // Строим финальную строку
  const allParts = [];
  if (mp) allParts.push(`${mp}тг`);
  allParts.push(...sections);

  return '💰Цена: ' + allParts.join(' | ');
}

function buildOutput(segments, active, prices, mainPrice, varNum) {
  if (!segments.length) return '';
  const lines = [`✈️ Вариант ${varNum} ✈️`];

  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    lines.push(
      `🗓️${parseInt(s.depDay, 10)} ${monthRu(s.depMon)}. ` +
      `${fmtTime(s.dep)} – ${fmtTime(s.arr)}, ` +
      `${airportName(s.from)} — ${airportName(s.to)}, ` +
      `${s.airline} ${s.flight}, ${airlineName(s.airline)}. ` +
      fmtDur(calcDuration(s))
    );
    if (i < segments.length - 1) {
      const layover = calcLayover(s, segments[i+1]);
      if (layover > 0 && layover <= 1439)
        lines.push(`_Пересадка ${fmtDur(layover)}_`);
    }
  }

  const pl = buildPriceLine(active, prices, mainPrice);
  if (pl) lines.push(pl);
  return lines.join('\n');
}

// ═══════════════════════════════════════════════════════════════
// UI — КАРТОЧКИ
// ═══════════════════════════════════════════════════════════════

let cards = [];
let nextId = 1;

function makePair(card, def) {
  /** Создаёт пару [кнопка][цена?] и возвращает корень. */
  const pair = document.createElement('div');
  pair.className = 'ctrl-pair';

  const btn = document.createElement('button');
  btn.className = 'tgl-btn';
  btn.textContent = def.label;
  btn.addEventListener('click', () => {
    const lbl = def.label;
    if (card.active.has(lbl)) {
      card.active.delete(lbl);
    } else {
      // Взаимоисключение внутри одной группы (exchange)
      if (def.excl) {
        BTN_DEFS.filter(d => d.excl === def.excl && d.label !== lbl)
          .forEach(d => card.active.delete(d.label));
      }
      card.active.add(lbl);
    }
    refreshCard(card);
  });

  pair.appendChild(btn);

  if (def.price) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'price-input';
    inp.placeholder = 'цена';
    inp.addEventListener('input', () => {
      card.prices[def.label] = inp.value;
      refreshCard(card);
    });
    pair.appendChild(inp);
    card._inputs[def.label] = inp;
  }

  card._btns[def.label] = btn;
  return pair;
}

function createCard(segments) {
  const id = nextId++;
  const card = {
    id,
    segments,
    active:    new Set(), // Set<string> — активные метки
    prices:    {},        // label → string
    mainPrice: '',        // главная цена (строка «Цена + поле»)
    _btns:     {},
    _inputs:   {},
  };

  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = id;

  // Заголовок
  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  const titleEl = document.createElement('div');
  titleEl.className = 'card-title';
  ['↑','⚡'].forEach(sym => {
    const b = document.createElement('button');
    b.className = 'icon-btn'; b.textContent = sym;
    hdr.appendChild(b);
  });
  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn'; delBtn.textContent = '✕'; delBtn.title = 'Удалить';
  delBtn.addEventListener('click', () => deleteCard(id));
  hdr.prepend(titleEl);
  hdr.appendChild(delBtn);
  el.appendChild(hdr);

  // Превью
  const preview = document.createElement('pre');
  preview.className = 'card-preview';
  el.appendChild(preview);

  // Панель кнопок — 2 строки
  const ctrl = document.createElement('div');
  ctrl.className = 'card-ctrl';

  for (const rowNum of [1, 2]) {
    const row = document.createElement('div');
    row.className = 'ctrl-row';

    // Строка 1: перед всеми кнопками ставим постоянную «Цена + поле»
    if (rowNum === 1) {
      const mainPair = document.createElement('div');
      mainPair.className = 'ctrl-pair';

      const mainBtn = document.createElement('button');
      mainBtn.className = 'tgl-btn active'; // всегда активна
      mainBtn.textContent = 'Цена';
      mainBtn.style.cursor = 'default';     // не кликабельная
      mainPair.appendChild(mainBtn);

      const mainInp = document.createElement('input');
      mainInp.type = 'text';
      mainInp.className = 'price-input';
      mainInp.placeholder = 'цена';
      mainInp.addEventListener('input', () => {
        card.mainPrice = mainInp.value;
        refreshCard(card);
      });
      mainPair.appendChild(mainInp);
      card._inputs['__main__'] = mainInp;

      row.appendChild(mainPair);

      // Разделитель после главной цены
      const dvd0 = document.createElement('span');
      dvd0.textContent = '|';
      dvd0.style.cssText = 'color:#999;font-size:20px;font-weight:bold;margin:0 6px;align-self:center;';
      row.appendChild(dvd0);
    }

    const rowDefs = BTN_DEFS.filter(d => d.row === rowNum);
    let prevGroup = null;
    for (const def of rowDefs) {
      const grpId = OUTPUT_GROUPS.findIndex(g => g.opts.includes(def.label));
      if (prevGroup !== null && grpId !== prevGroup) {
        const dvd = document.createElement('span');
        dvd.textContent = '|';
        dvd.style.cssText = 'color:#999;font-size:20px;font-weight:bold;margin:0 6px;align-self:center;';
        row.appendChild(dvd);
      }
      prevGroup = grpId;
      row.appendChild(makePair(card, def));
    }
    ctrl.appendChild(row);
  }

  el.appendChild(ctrl);

  card.el = el;
  card._titleEl = titleEl;
  card._preview = preview;

  cards.push(card);
  document.getElementById('cardsArea').appendChild(el);
  renumberCards();
  refreshCard(card);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function refreshCard(card) {
  const n = cards.findIndex(c => c.id === card.id) + 1;
  card._titleEl.textContent = `Вариант ${n}`;
  // Визуал кнопок
  for (const [lbl, btn] of Object.entries(card._btns))
    btn.classList.toggle('active', card.active.has(lbl));
  // Превью
  card._preview.textContent = buildOutput(card.segments, card.active, card.prices, card.mainPrice, n);
}

function deleteCard(id) {
  const idx = cards.findIndex(c => c.id === id);
  if (idx < 0) return;
  cards[idx].el.remove();
  cards.splice(idx, 1);
  renumberCards();
}

function renumberCards() {
  cards.forEach((card, i) => {
    const n = i + 1;
    card._titleEl.textContent = `Вариант ${n}`;
    card._preview.textContent = buildOutput(card.segments, card.active, card.prices, card.mainPrice, n);
  });
}

// ═══════════════════════════════════════════════════════════════
// АВТОПАРСИНГ ПРИ ВСТАВКЕ
// ═══════════════════════════════════════════════════════════════

const input = document.getElementById('pnrInput');
const statusEl = document.getElementById('statusMsg');
let statusTimer = null;

function setStatus(msg, isErr) {
  clearTimeout(statusTimer);
  statusEl.textContent = msg;
  statusEl.className = isErr ? '' : 'ok';
  if (msg) statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 3000);
}

function autoParse() {
  const raw = input.value.trim();
  if (!raw) return;
  const segs = parseSegments(raw);
  if (segs.length) {
    createCard(segs);
    input.value = '';
    setStatus(`✓ Вариант ${cards.length} добавлен`, false);
  } else {
    setStatus('⚠ Не удалось распознать сегменты рейса. Проверьте формат.', true);
  }
}

input.addEventListener('paste', () => setTimeout(autoParse, 150));

// ═══════════════════════════════════════════════════════════════
// ГЛОБАЛЬНЫЕ КНОПКИ
// ═══════════════════════════════════════════════════════════════

function clearAll() {
  cards.forEach(c => c.el.remove());
  cards = [];
  input.value = '';
  setStatus('', false);
}

function copyAll() {
  if (!cards.length) {
    setStatus('⚠ Нет вариантов для копирования', true);
    return;
  }
  const text = cards.map((card, i) =>
    buildOutput(card.segments, card.active, card.prices, card.mainPrice, i + 1)
  ).join('\n\n');

  navigator.clipboard.writeText(text)
    .then(() => setStatus('✓ Скопировано в буфер обмена!', false))
    .catch(() => {
      // fallback для браузеров без clipboard API
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      setStatus('✓ Скопировано!', false);
    });
}
</script>
